# ============================================================================
# nginx.conf —— 正向代理（CONNECT + 普通 GET）
#
# 本次故障的修复本体在 docker-compose.yml（network_mode: host），不在这个文件。
#
#   resolver 168.63.129.16  **保持原样，一个字都没改。**
#
#   它从头到尾都是对的。真正的问题是容器出不了 Docker 网桥，于是任何从容器
#   发出的 DNS 查询都收不到回包，看起来像"resolver 配错了"。对照实例里同一个
#   容器名、同一个地址、同一份 conf，解析完全正常 —— 证据详见
#   nginx-dns-diagnosis.md 第 23–24 节。
#
#   改 host 模式后容器与 devcontainer 共用网络栈，预检第 2、4 组实测该地址
#   可达（容器 resolv.conf 里也只剩它一项：Docker 生成时会滤掉 loopback 项，
#   所以 devcontainer 的 127.0.0.53 不会出现在容器内）。
#
# ------------------------------------------------------- 相对原配置的改动（2处）
#
#   1) resolver_timeout 30s -> 5s
#      DNS 一旦异常，原值会让每个请求挂满 30 秒才报错，连接迅速堆积。
#      与网络修复无关，属独立的健壮性改进。
#
#   2) log_format 补回 $status / $upstream_addr / $request_time
#      原格式只有 'proxy_pass to: ... Host ...' 两段，成功和失败长得一模一样，
#      排障期等于没有日志。补回这几个字段后，一次 tail 就能分辨成败。
#
# ---------------------------------------------------------------- 可选加固（未启用）
#
#   · worker_rlimit_nofile 65535;  +  worker_connections 10240
#     原值 worker_connections 与 getrlimit(NOFILE) soft limit 都是 1024，
#     而实际可用连接还要扣掉 listen / 日志 / resolver 占用的 fd，达不到 1024。
#     单机自用够用，高并发再开。
#
#   · proxy_connect_read_timeout 30s -> 60s
#     读超时 30 秒对大文件下载偏短，容易在正常慢连接上误杀。
#
# ---------------------------------------------------------------- 其他已知事项
#
#   · proxy_connect 系列指令**不是 nginx 官方指令**，来自第三方模块
#     ngx_http_proxy_connect_module，因此镜像是用 Dockerfile 自编译的
#     （见同目录 Dockerfile / prepare.sh）。升级 nginx 时必须同步换 patch。
#
#   · host 模式下没有 ports: 发布，18088 直接绑在 devcontainer 上。
#     若浏览器访问不到，在 VS Code 的「端口 / Ports」面板手动添加 18088，
#     不要去改 devcontainer.json（会触发重建、换环境）。
#
#   · 本文件是挂载进容器的，改完只需：
#       docker exec nginx-proxy-proxy-1 nginx -t
#       docker exec nginx-proxy-proxy-1 nginx -s reload
# ============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # include /etc/nginx/conf.d/*.conf;

    # server {
    #     listen 80;
    #     location / {
    #         proxy_pass https://hub.docker.com/; # https://cn.bing.com/; # https://hub.docker.com/; # https://api.openai.com/;
    #         proxy_ssl_server_name on;
    #         proxy_set_header Host hub.docker.com; # cn.bing.com; # hub.docker.com; # api.openai.com;
    #         chunked_transfer_encoding off;
    #         proxy_buffering off;
    #         proxy_cache off;
    #         proxy_set_header X-Forwarded-For $remote_addr;
    #     }
    # }

    server {
        listen 18088;

        # DNS: host 模式下容器与 devcontainer 共用网络栈，该地址已实测可达。
        # 保持原值 —— 本次故障与这一行无关。
        resolver 168.63.129.16 valid=60s ipv6=off;

        # 原值 30s 过长，改为 5s
        resolver_timeout 5s;

        proxy_connect;
        proxy_connect_allow            443 80;
        proxy_connect_connect_timeout  30s;
        proxy_connect_read_timeout     30s;
        proxy_connect_send_timeout     30s;
        proxy_request_buffering        off;

        location / {
             proxy_pass $scheme://$http_host$request_uri;
             proxy_set_header Host $host;
        }
    }
}
